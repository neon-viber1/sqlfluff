rule: BQ01

test_with_expression_allowed_by_default:
  pass_str: SELECT WITH (value AS 1, value + 1);
  configs:
    core:
      dialect: bigquery

test_with_expression_explicitly_allowed:
  pass_str: SELECT WITH (value AS 1, value + 1);
  configs:
    core:
      dialect: bigquery
    rules:
      bigquery.with_expressions:
        allow: true

test_with_expression_disallowed:
  fail_str: SELECT WITH (value AS 1, value + 1);
  configs:
    core:
      dialect: bigquery
    rules:
      bigquery.with_expressions:
        allow: false

test_plain_select_unaffected:
  pass_str: SELECT 1;
  configs:
    core:
      dialect: bigquery
    rules:
      bigquery.with_expressions:
        allow: false

test_cte_is_not_a_with_expression:
  pass_str: |
    WITH source AS (SELECT 1 AS value)
    SELECT value FROM source;
  configs:
    core:
      dialect: bigquery
    rules:
      bigquery.with_expressions:
        allow: false
